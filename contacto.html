<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./img/logo.png">



</head>
<body>
    <section class="contact-page">

    <div class="contact-page-head">

        <h1>Contacto</h1>

        <p>
            ¿Tienes alguna pregunta o quieres reservar una clase?
            Puedes escribirme o reservar directamente.
        </p>

    </div>


    <div class="contact-grid">


        <!-- TARJETA 1: CONTACTO -->

        <div class="grid-box contact-card">

            <div class="section-head">

                <h2>
                    📨 Deja tu mensaje
                </h2>

                <p>
                    ¿Tienes alguna pregunta?
                    
                </p>

            </div>


            <form
                class="contact-form"
                action="https://formsubmit.co/TU_EMAIL"
                method="POST"
            >

                <input
                    type="hidden"
                    name="_subject"
                    value="Nuevo mensaje desde Programación para tod@s"
                >

                <input
                    type="hidden"
                    name="_template"
                    value="table"
                >

                <input
                    type="hidden"
                    name="_captcha"
                    value="true"
                >

                <input
                    type="text"
                    name="_honey"
                    style="display:none"
                >


                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="name"
                        placeholder="Tu nombre"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                    >

                </div>
                
                <div class="form-group">

                    <label for="phone">
                        Teléfono/celular
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="name"
                        placeholder="A qué número contactar"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="mensaje">
                        Mensaje
                    </label>

                    <textarea
                        id="mensaje"
                        name="message"
                        placeholder="Escribe aquí tu mensaje..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Enviar mensaje 🚀
                </button>

            </form>
            <h3>ó</h3>

            <div class="whatsapp-container">

                <a
                    class="whatsapp-btn"
                    href="https://wa.me/34634059171"
                    target="_blank"
                    rel="noopener"
                >
                    💬 Mensaje directo por WhatsApp
                </a>

            </div>

        </div>



        <!-- TARJETA 2: RESERVA -->

        <div class="grid-box contact-card reservation-card">

            <div class="section-head">

                <h2>
                    📆 Reserva directamente
                </h2>

                <p>
                    Elige el día y la hora que mejor te venga.
                </p>

            </div>


            <!-- Google Calendar Appointment Scheduling -->

            <iframe
                src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ3jTNrdVO-2iQgcnf659XZFFRHjtzOGjb1jcsbewhzxE7Aw_hO1lKrl6UaegT0ND5SL3o0_Kljm?gv=true"
                class="calendar-frame"
                frameborder="0"
            ></iframe>

        </div>


    </div>

</section>
</body>
</html>
